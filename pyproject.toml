[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec-agent"
version = "0.1.0"
description = "A guarded, evidence-based network security assessment agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.4.0",
    "langchain-groq>=1.1.0",
    "langgraph>=1.2.0",
    "mcp>=1.20.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
